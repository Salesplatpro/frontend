name: Branch Sync Check

on:
  pull_request:
    branches: ['main', 'development']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-branch-sync:
    name: Ensure main has no content missing from development
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'development'

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check main's content is fully contained in development
        run: |
          # This repo squash-merges PRs into both branches, which rewrites commit
          # SHAs on every merge. That makes plain commit-ancestry checks
          # (git log a..b) unreliable, since squashed commits never match their
          # originals by hash even when the content is identical. Simulating the
          # actual merge and inspecting the resulting diff checks content instead,
          # so it isn't fooled by history reshaping.
          git fetch origin main development
          git config user.email "ci@github-actions"
          git config user.name "github-actions"
          git checkout -B __sync_check origin/development

          if ! git merge --no-commit --no-ff origin/main; then
            echo "::error::Merging main into development produced conflicts. main and development have diverged in a way that needs manual reconciliation before merging development into main."
            git merge --abort
            exit 1
          fi

          if ! git diff --cached --quiet; then
            echo "::error::main has changes that are not present in development. These would need to be backported/reconciled before this merge (e.g. a hotfix merged straight to main that was never brought back to development):"
            git diff --cached --stat
            git reset --hard
            exit 1
          fi

          git reset --hard
          echo "✅ development already contains everything on main — safe to merge."
